# 저장소 안의 것만으로 할 수 있는 검사.
#
# 플러그인을 여기서 빌드하지는 못한다. 컴파일에 게임의 Managed 폴더
# (UnityEngine.dll, Scripts.dll ...)가 필요한데 그것은 게임 원저작물이라
# 올려 둘 수 없다. 같은 이유로 decompiled/ 가 있어야 하는
# check_data_collisions.py 도 여기서는 돌릴 수 없다.
#
# 빌드와 배포는 손에서 한다:  python tools/make_release.py <버전> --publish

name: 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 번역 JSON이 깨지지 않았는지
        run: python tools/ci_check.py
